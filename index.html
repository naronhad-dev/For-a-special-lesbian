<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Protocol</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:black;
    color:#00ff66;
    font-family:"Courier New",monospace;
    text-align:center;
    overflow:hidden;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

#terminal{
    margin-top:12vh;
    font-size:22px;
    padding:20px;
    text-shadow:0 0 10px #00ff66;
}

button{
    background:transparent;
    color:#00ff66;
    border:2px solid #00ff66;
    padding:15px 30px;
    font-size:18px;
    font-family:monospace;
    cursor:pointer;
    box-shadow:0 0 20px #00ff66;
}

button:hover{
    background:#00ff66;
    color:black;
}

#photo{
    display:none;
    width:300px;
    max-width:85%;
    border-radius:20px;
    margin-top:20px;
    box-shadow:0 0 40px #00ff66;
    animation:reveal 2s;
}

@keyframes reveal{
    from{
        opacity:0;
        transform:scale(.2) rotate(20deg);
        filter:blur(20px);
    }

    to{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}


.glitch{
    animation:glitch .2s infinite;
}


@keyframes glitch{

    0%{
        transform:translate(5px);
        filter:hue-rotate(90deg);
    }

    50%{
        transform:translate(-5px);
        filter:hue-rotate(180deg);
    }

    100%{
        transform:translate(0);
    }

}

</style>

</head>


<body>


<canvas id="matrix"></canvas>


<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>


<div id="terminal">

<button onclick="start()">ACCESS FILE</button>

<p id="text"></p>

<img id="photo" src="herphoto.jpg">

</div>



<script>


// MATRIX EFFECT

let canvas=document.getElementById("matrix");
let ctx=canvas.getContext("2d");

canvas.height=window.innerHeight;
canvas.width=window.innerWidth;

let letters="01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
letters=letters.split("");

let fontSize=16;
let columns=canvas.width/fontSize;

let drops=[];

for(let i=0;i<columns;i++){
    drops[i]=1;
}


function drawMatrix(){

    ctx.fillStyle="rgba(0,0,0,0.08)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#00ff66";
    ctx.font=fontSize+"px monospace";


    for(let i=0;i<drops.length;i++){

        let text=letters[Math.floor(Math.random()*letters.length)];

        ctx.fillText(
            text,
            i*fontSize,
            drops[i]*fontSize
        );


        if(drops[i]*fontSize > canvas.height && Math.random()>0.975){
            drops[i]=0;
        }

        drops[i]++;
    }

}

setInterval(drawMatrix,35);





// SCAN SYSTEM


function start(){


document.getElementById("music").play();


let text=document.getElementById("text");


let lines=[

"BOOTING SYSTEM...",
"CONNECTING DATABASE...",
"SCANNING SUBJECT...",
"FACE RECOGNITION ACTIVE...",
"",
"✓ SUBJECT FOUND",
"",
"NAME: GANDU",
"STATUS: BEST TWIN"

];


let i=0;


let scan=setInterval(()=>{


text.innerHTML += lines[i]+"<br>";

i++;


if(i>=lines.length){


clearInterval(scan);


setTimeout(()=>{


document.body.classList.add("glitch");


text.innerHTML +=
"<br>⚠ GLITCH TRANSITION ⚠<br><br>"+
"🐺 SYSTEM VOICE DETECTED...<br><br>"+
"Luv you twin ❤️";


document.getElementById("photo").style.display="inline-block";


},1500);


}


},800);



}


</script>


</body) 
</html>
