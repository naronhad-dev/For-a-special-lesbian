<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PROJECT TWINSHIP</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
background:#020403;
display:flex;
align-items:center;
justify-content:center;
font-family:"Courier New",monospace;
color:#b7ffcb;
overflow:hidden;
}


#app{
width:95%;
max-width:800px;
height:90vh;
background:#050907;
border:1px solid #4cff87;
box-shadow:0 0 40px rgba(50,255,120,.15);
padding:25px;
position:relative;
overflow:hidden;
}


#app:before{
content:"";
position:absolute;
inset:0;
background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.03),
rgba(255,255,255,.03) 1px,
transparent 1px,
transparent 5px
);
pointer-events:none;
}



h1{
letter-spacing:6px;
text-align:center;
font-size:32px;
}


.center{
text-align:center;
margin-top:80px;
}



button{
background:#08110b;
border:1px solid #4cff87;
color:#b7ffcb;
padding:14px 30px;
font-family:inherit;
cursor:pointer;
transition:.3s;
}


button:hover{
background:#14301d;
transform:translateY(-2px);
}




.panel{

border:1px solid #254d32;
padding:15px;
margin:15px 0;
background:#070c08;

}



#archive,
#final{

display:none;

}



.progress{

width:100%;
height:12px;
border:1px solid #4cff87;

}


#bar{

height:100%;
width:0;
background:#4cff87;

}




.photos{

display:flex;
gap:15px;
flex-wrap:wrap;

}



.photos img{

width:30%;
min-width:120px;
border:1px solid #4cff87;
filter:contrast(1.1);

}



.fade{

animation:fade 1s;

}



@keyframes fade{

from{
opacity:0;
}

to{
opacity:1;
}

}



.cursor{

animation:blink 1s infinite;

}


@keyframes blink{

50%{
opacity:0;
}

}


</style>

</head>


<body>



<audio id="music" loop>

<source src="music.mp3">

</audio>



<div id="app">


<div id="boot" class="center">


<h1>
PROJECT TWINSHIP
</h1>


<p>
CLASSIFIED MEMORY ARCHIVE
</p>


<p id="text">
INITIALIZING SYSTEM...
</p>



<br>


<button onclick="start()">

BEGIN ACCESS

</button>



</div>





<div id="archive">


<h1>
TWINSHIP FILE
</h1>



<div class="panel">

> USER FOUND: GANNU

<br>

> CONNECTION: SPECIAL

<br>

> MEMORY STATUS: COMPLETE

</div>



<div class="panel">


DECRYPTING MEMORIES


<div class="progress">

<div id="bar"></div>

</div>


</div>



<div class="photos">

<img src="photo1.jpg">

<img src="photo2.jpg">

<img src="photo3.jpg">

</div>


<br>


<button onclick="finish()">

OPEN FINAL MESSAGE

</button>



</div>





<div id="final" class="center">


<h1>
ACCESS GRANTED
</h1>


<p>

HAPPY BIRTHDAY TWIN

</p>


<p>

I LOVE YOU

</p>


</div>




</div>




<script>


function start(){


document.getElementById("boot").style.display="none";


document.getElementById("archive").style.display="block";


document.getElementById("music").play();



let width=0;


let timer=setInterval(()=>{


width+=2;


document.getElementById("bar").style.width=width+"%";


if(width>=100){

clearInterval(timer);

}


},40);


}





function finish(){


document.getElementById("archive").style.display="none";


document.getElementById("final").style.display="block";


}



</script>



</body>
</html>
