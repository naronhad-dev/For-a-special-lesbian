<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twin Quest</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
height:100vh;

background:#090923;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

font-family:monospace;

color:white;

}


#game{

width:95%;
max-width:600px;

height:90vh;

background:#15154a;

border:8px solid #ffe7a0;

box-shadow:8px 8px #000;

position:relative;

overflow:hidden;

text-align:center;

}



#game:after{

content:"";

position:absolute;

inset:0;

background:

repeating-linear-gradient(

0deg,

rgba(255,255,255,.05),

rgba(255,255,255,.05) 2px,

transparent 2px,

transparent 5px

);

pointer-events:none;

}



.sky{

position:absolute;

inset:0;

background:

linear-gradient(

#16165c,

#080820

);

}




.star{

position:absolute;

width:5px;

height:5px;

background:white;

animation:shine 2s infinite;

}


@keyframes shine{

50%{

opacity:.2;

}

}





.moon{

position:absolute;

right:45px;

top:45px;

width:55px;

height:55px;

background:#fff0a8;

border-radius:50%;

}





.cloud{

position:absolute;

height:20px;

width:90px;

background:#7777aa;

animation:cloudMove 18s linear infinite;

}



.cloud:before{

content:"";

position:absolute;

width:35px;

height:25px;

background:#7777aa;

left:20px;

top:-15px;

}



@keyframes cloudMove{

from{

left:-120px;

}

to{

left:700px;

}

}





.title{

position:relative;

margin-top:90px;

font-size:32px;

color:#ffd83d;

text-shadow:

4px 4px #8b4513;

line-height:1.5;

}



.subtitle{

position:relative;

margin-top:20px;

font-size:14px;

}





button{

position:relative;

margin-top:40px;

padding:18px 35px;

background:#b52b2b;

color:white;

border:5px solid white;

font-size:18px;

font-family:monospace;

box-shadow:6px 6px #000;

cursor:pointer;

}



button:active{

transform:translate(5px,5px);

box-shadow:1px 1px #000;

}



</style>

</head>


<body>


<div id="game">


<div class="sky"></div>


<div class="star" style="left:10%;top:20%"></div>

<div class="star" style="left:25%;top:35%"></div>

<div class="star" style="left:45%;top:15%"></div>

<div class="star" style="left:70%;top:25%"></div>

<div class="star" style="left:85%;top:40%"></div>


<div class="moon"></div>


<div class="cloud" style="top:150px"></div>

<div class="cloud" style="top:230px;animation-delay:5s"></div>




<div class="title">

TWIN QUEST

<br>

LOST MEMORIES

</div>



<div class="subtitle">

A RETRO ADVENTURE

</div>




<button onclick="startGame()">

START GAME

</button>





<audio id="music" loop>

<source src="music.mp3" type="audio/mpeg">

</audio>
<style>


#worldScreen{

display:none;

position:absolute;

inset:0;

background:

linear-gradient(
#4b8cff 0%,
#8ed6ff 55%,
#5dbb63 55%,
#327a36 100%
);

}



.hud{

position:absolute;

top:10px;

left:10px;

right:10px;

background:#111;

padding:10px;

font-size:12px;

display:flex;

justify-content:space-between;

}



#player{

position:absolute;

width:50px;

height:50px;

background:#ffd83d;

border:4px solid #000;

bottom:90px;

left:80px;

}



.obstacle{

position:absolute;

bottom:70px;

width:45px;

height:45px;

background:#654321;

border:4px solid black;

}



.enemyGame{

position:absolute;

bottom:90px;

width:45px;

height:45px;

background:#b52b2b;

border:4px solid black;

}



.beam{

position:absolute;

width:45px;

height:8px;

background:white;

border:2px solid #00ffff;

}




.controls{

position:absolute;

bottom:15px;

left:0;

right:0;

display:flex;

justify-content:space-around;

}



.controls button{

margin:0;

padding:12px;

font-size:14px;

background:#222;

}


</style>





<div id="worldScreen">


<div class="hud">

<span id="score">

SCORE 0000

</span>


<span id="lives">

LIVES 03

</span>


</div>



<div id="player"></div>



<div class="obstacle" style="left:300px"></div>

<div class="obstacle" style="left:520px"></div>



<div class="enemyGame" style="left:420px"></div>

<div class="enemyGame" style="left:650px"></div>






<div class="controls">


<button onclick="moveLeft()">

LEFT

</button>


<button onclick="moveForward()">

FORWARD

</button>


<button onclick="jump()">

JUMP

</button>


<button onclick="attack()">

ATTACK

</button>


</div>



</div>






<script>


let player=document.getElementById("player");


let position=80;

let jumping=false;


function startGame(){


document.getElementById("music").play();


document.querySelector("#game").style.display="none";


document.getElementById("worldScreen").style.display="block";


}






function moveLeft(){

position-=25;

player.style.left=position+"px";

}




function moveForward(){

position+=25;

player.style.left=position+"px";

}





function jump(){


if(jumping) return;


jumping=true;


let up=0;


let jumpInterval=setInterval(()=>{


up+=10;


player.style.bottom=(90+up)+"px";



if(up>=100){


clearInterval(jumpInterval);



let down=setInterval(()=>{


up-=10;


player.style.bottom=(90+up)+"px";


if(up<=0){


clearInterval(down);

jumping=false;


}


},50);



}



},50);



}






function attack(){


let beam=document.createElement("div");


beam.className="beam";


beam.style.left=(position+50)+"px";


beam.style.bottom="120px";


document.getElementById("worldScreen").appendChild(beam);



let move=setInterval(()=>{


let x=parseInt(beam.style.left);


beam.style.left=(x+15)+"px";



if(x>700){


beam.remove();

clearInterval(move);


}



},30);



}



</script>
    <style>

.memory{

position:absolute;

bottom:130px;

width:25px;

height:25px;

background:#ffd83d;

border:3px solid white;

}



#finishScreen{

display:none;

position:absolute;

inset:0;

background:#11113b;

color:white;

text-align:center;

padding-top:35vh;

font-size:22px;

line-height:2;

}


</style>




<div class="memory" style="left:220px"></div>

<div class="memory" style="left:580px"></div>



<div id="finishScreen">


QUEST COMPLETE


<br><br>


ALL MEMORIES RESTORED


<br><br>


HAPPY BIRTHDAY TWIN


<br>


I LOVE YOU


</div>






<script>


let score=0;


let memories=0;



let enemies=document.querySelectorAll(".enemyGame");


let memoriesList=document.querySelectorAll(".memory");





function updateScore(){


document.getElementById("score").innerHTML=

"SCORE "+score.toString().padStart(4,"0");


}






function checkCollision(){


let p=player.getBoundingClientRect();



document.querySelectorAll(".obstacle,.enemyGame").forEach(obj=>{


let o=obj.getBoundingClientRect();



if(

p.left < o.right &&

p.right > o.left &&

p.top < o.bottom &&

p.bottom > o.top

){


position-=40;

player.style.left=position+"px";


}



});






memoriesList.forEach((m)=>{


let a=player.getBoundingClientRect();

let b=m.getBoundingClientRect();



if(

a.left < b.right &&

a.right > b.left &&

a.top < b.bottom &&

a.bottom > b.top

){


m.remove();


memories++;


score+=100;


updateScore();



if(memories>=2){


document.getElementById("finishScreen").style.display="block";


}



}



});



}




setInterval(checkCollision,100);







// enemy movement


let enemyMove=0;


setInterval(()=>{


enemies.forEach(e=>{


let current=parseInt(e.style.left);


if(!current){

current=e.offsetLeft;

}


current-=10;


if(current<-50){

current=700;

}


e.style.left=current+"px";



});



},150);






</script>



</div>

</body>

</html>
