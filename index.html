<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Save The Twinship</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
height:100vh;

background:#05051a;

display:flex;
justify-content:center;
align-items:center;

font-family:monospace;

overflow:hidden;

color:white;

}


#game{

width:95%;
max-width:650px;

height:90vh;

background:#09092d;

border:8px solid #ffd85c;

box-shadow:8px 8px #000;

position:relative;

overflow:hidden;

}



/* NIGHT SKY */

.sky{

position:absolute;

inset:0;

background:linear-gradient(
#05051c,
#17175a
);

}



.star{

position:absolute;

width:4px;

height:4px;

background:white;

animation:twinkle 2s infinite;

}



@keyframes twinkle{

50%{

opacity:.25;

}

}





.moon{

position:absolute;

right:50px;

top:40px;

width:60px;

height:60px;

background:#ffe9a3;

border-radius:50%;

}





.cloud{

position:absolute;

width:90px;

height:18px;

background:#33335c;

animation:cloudMove 20s linear infinite;

}



.cloud:before{

content:"";

position:absolute;

width:30px;

height:20px;

background:#33335c;

top:-12px;

left:20px;

}



.cloud:after{

content:"";

position:absolute;

width:30px;

height:20px;

background:#33335c;

top:-10px;

right:10px;

}



@keyframes cloudMove{

from{

left:-120px;

}

to{

left:700px;

}

}





.menu{

position:relative;

z-index:5;

text-align:center;

padding-top:100px;

}




.title{

font-size:34px;

color:#ffd83d;

text-shadow:

4px 4px #8b4513;

}



.subtitle{

margin-top:15px;

color:#aaa;

}




.characters{

margin-top:35px;

}



.character{

display:inline-block;

background:#17174a;

border:4px solid #777;

padding:15px;

margin:10px;

cursor:pointer;

}



.character.selected{

border-color:#ffd83d;

color:#ffd83d;

}





button{

font-family:monospace;

font-size:16px;

padding:15px 30px;

background:#b52b2b;

color:white;

border:4px solid white;

box-shadow:5px 5px #000;

cursor:pointer;

margin-top:25px;

}



button:active{

transform:translate(4px,4px);

box-shadow:1px 1px #000;

}


</style>

</head>


<body>


<div id="game">


<div class="sky"></div>


<div class="star" style="left:10%;top:20%"></div>

<div class="star" style="left:25%;top:35%"></div>

<div class="star" style="left:50%;top:15%"></div>

<div class="star" style="left:75%;top:25%"></div>

<div class="star" style="left:85%;top:10%"></div>


<div class="moon"></div>


<div class="cloud" style="top:120px"></div>

<div class="cloud" style="top:220px;animation-delay:8s"></div>




<div class="menu" id="menu">


<div class="title">

SAVE THE TWINSHIP

</div>


<div class="subtitle">

8-BIT BIRTHDAY QUEST

</div>




<div class="characters">


<h3>SELECT CHARACTER</h3>


<div class="character selected" onclick="selectChar('Gannu')">

GANNU

</div>


<div class="character" onclick="selectChar('Dishan')">

DISHAN

</div>


</div>





<button onclick="startGame()">

START QUEST

</button>



</div>




<audio id="music" loop>

<source src="music.mp3" type="audio/mpeg">

</audio>
  
<style>


#world{

display:none;

position:absolute;

inset:0;

background:

linear-gradient(

#08082b,

#17175a 55%,

#163d1b 55%,

#08200b

);

overflow:hidden;

}





.ground{

position:absolute;

bottom:0;

width:100%;

height:90px;

background:

linear-gradient(

#43a047,

#145214

);

border-top:8px solid #7bdc45;

}



.ground:after{

content:"";

position:absolute;

top:35px;

left:0;

width:100%;

height:8px;

background:#246b27;

}





#hero{

position:absolute;

bottom:90px;

left:80px;

width:42px;

height:55px;

background:#e0a12b;

border:4px solid black;

}



#hero:before{

content:"";

position:absolute;

top:-14px;

left:8px;

width:20px;

height:14px;

background:#ffd38a;

}




.enemy{

position:absolute;

bottom:90px;

width:45px;

height:45px;

background:#8b2635;

border:4px solid black;

}



.enemy:before{

content:"";

position:absolute;

top:8px;

left:8px;

width:8px;

height:8px;

background:white;

box-shadow:18px 0 white;

}





.block{

position:absolute;

bottom:90px;

width:45px;

height:45px;

background:#704214;

border:4px solid black;

}





.beam{

position:absolute;

height:8px;

width:55px;

background:#9fffff;

border:2px solid white;

}





.hud{

position:absolute;

top:10px;

left:10px;

right:10px;

padding:8px;

background:black;

border:3px solid white;

z-index:5;

display:flex;

justify-content:space-between;

}





.controls{

position:absolute;

bottom:10px;

left:0;

right:0;

display:flex;

justify-content:center;

z-index:5;

}



.controls button{

font-size:12px;

padding:10px;

margin:4px;

background:#202050;

}





</style>





<div id="world">


<div class="hud">

<span id="lives">

LIVES: 3

</span>


<span>

STAGE 1

</span>


</div>






<div class="star" style="left:30%;top:20%"></div>

<div class="star" style="left:70%;top:30%"></div>






<div id="hero"></div>





<div class="enemy" style="left:350px"></div>

<div class="enemy" style="left:650px"></div>




<div class="block" style="left:250px"></div>

<div class="block" style="left:560px"></div>





<div class="ground"></div>




<div class="controls">


<button onclick="moveLeft()">

BACK

</button>


<button onclick="moveRight()">

FORWARD

</button>


<button onclick="jump()">

JUMP

</button>


<button onclick="attack()">

FIRE

</button>


</div>



</div>








<script>


let character="Gannu";


let playerX=80;


let jumping=false;






function selectChar(name){

character=name;

}




function startGame(){


document.getElementById("music").play();


document.getElementById("menu").style.display="none";


document.getElementById("world").style.display="block";


}






function moveRight(){


playerX+=25;


document.getElementById("hero").style.left=

playerX+"px";


}





function moveLeft(){


playerX-=25;


if(playerX<0){

playerX=0;

}


document.getElementById("hero").style.left=

playerX+"px";


}






function jump(){


if(jumping)return;


jumping=true;


let h=0;


let up=setInterval(()=>{


h+=10;


document.getElementById("hero").style.bottom=

(90+h)+"px";



if(h>=100){


clearInterval(up);


let down=setInterval(()=>{


h-=10;


document.getElementById("hero").style.bottom=

(90+h)+"px";


if(h<=0){


clearInterval(down);

jumping=false;


}


},50);


}


},50);



}






function attack(){


let beam=document.createElement("div");


beam.className="beam";


beam.style.left=(playerX+45)+"px";


beam.style.bottom="130px";


document.getElementById("world").appendChild(beam);




let move=setInterval(()=>{


let x=parseInt(beam.style.left);


beam.style.left=(x+12)+"px";



if(x>700){


beam.remove();


clearInterval(move);


}


},30);



}

<style>


#bossStage{

display:none;

position:absolute;

inset:0;

background:

linear-gradient(

#09091f,

#310d35

);

overflow:hidden;

}



#boss{

position:absolute;

right:80px;

bottom:100px;

width:100px;

height:100px;

background:#5c1625;

border:6px solid black;

}



#boss:after{

content:"GANDU";

position:absolute;

top:-30px;

left:20px;

color:white;

font-size:14px;

}



#bossBar{

position:absolute;

top:30px;

left:20%;

width:60%;

height:20px;

background:#222;

border:3px solid white;

}



#bossHP{

height:100%;

width:100%;

background:red;

}



#chest{

display:none;

position:absolute;

left:280px;

bottom:100px;

width:60px;

height:45px;

background:#c58a2b;

border:5px solid black;

}



#interact{

display:none;

position:absolute;

left:270px;

bottom:170px;

}



#letter{

display:none;

position:absolute;

inset:0;

background:#050518;

z-index:20;

text-align:center;

padding-top:35vh;

font-size:24px;

color:#ffd83d;

line-height:2;

}



</style>






<div id="bossStage">


<div id="bossBar">

<div id="bossHP"></div>

</div>




<div id="boss"></div>



<div id="chest"></div>



<button id="interact">

INTERACT

</button>



</div>





<div id="letter">

QUEST COMPLETE

<br><br>

HAPPY BIRTHDAY TWIN

<br>

I LOVE YOU

</div>







<script>


let bossHealth=100;


let defeated=false;





function startBoss(){


document.getElementById("world").style.display="none";


document.getElementById("bossStage").style.display="block";


}







function hitBoss(){


if(defeated)return;



bossHealth-=20;



document.getElementById("bossHP").style.width=

bossHealth+"%";



if(bossHealth<=0){


defeated=true;


document.getElementById("boss").style.display="none";


document.getElementById("chest").style.display="block";


document.getElementById("interact").style.display="block";


}



}







document.getElementById("interact").onclick=function(){


document.getElementById("letter").style.display="block";


};





// Clicking FIRE in boss stage damages boss

document.addEventListener("click",function(e){


if(

e.target.innerText=="FIRE"

&&

document.getElementById("bossStage").style.display=="block"

){


hitBoss();


}



});





</script>


</div>


</body>

</html>
