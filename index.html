<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twin Quest</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
height:100vh;

background:#080820;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

font-family:monospace;

color:white;

}


#game{

width:95%;
max-width:600px;

height:90vh;

background:#15154a;

border:8px solid #ffe7a0;

box-shadow:8px 8px #000;

position:relative;

overflow:hidden;

text-align:center;

}





/* CRT EFFECT */

#game::after{

content:"";

position:absolute;

inset:0;

background:

repeating-linear-gradient(

0deg,

rgba(255,255,255,0.05),

rgba(255,255,255,0.05) 2px,

transparent 2px,

transparent 5px

);

pointer-events:none;

}





.sky{

position:absolute;

inset:0;

background:

linear-gradient(

#14145a,

#07071c

);

}





.star{

position:absolute;

width:5px;

height:5px;

background:white;

animation:blink 2s infinite;

}



@keyframes blink{

50%{

opacity:.2;

}

}





.moon{

position:absolute;

top:40px;

right:50px;

width:60px;

height:60px;

background:#fff1a8;

border-radius:50%;

}






.cloud{

position:absolute;

width:100px;

height:25px;

background:#7777aa;

animation:moveCloud 18s linear infinite;

}



.cloud:before{

content:"";

position:absolute;

width:35px;

height:25px;

background:#7777aa;

left:20px;

top:-15px;

}




@keyframes moveCloud{

from{

left:-120px;

}

to{

left:700px;

}

}






.title{

position:relative;

margin-top:120px;

font-size:32px;

color:#ffd83d;

text-shadow:

4px 4px #8b4513;

line-height:1.5;

}





.subtitle{

position:relative;

margin-top:20px;

font-size:14px;

}




button{

position:relative;

margin-top:50px;

padding:18px 40px;

background:#b52b2b;

color:white;

border:5px solid white;

font-size:18px;

font-family:monospace;

box-shadow:6px 6px #000;

cursor:pointer;

}



button:active{

transform:translate(5px,5px);

box-shadow:1px 1px #000;

}





</style>

</head>


<body>


<div id="game">


<div class="sky"></div>


<div class="star" style="left:10%;top:20%"></div>
<div class="star" style="left:25%;top:35%"></div>
<div class="star" style="left:45%;top:15%"></div>
<div class="star" style="left:70%;top:25%"></div>
<div class="star" style="left:85%;top:40%"></div>


<div class="moon"></div>


<div class="cloud" style="top:150px"></div>
<div class="cloud" style="top:240px;animation-delay:5s"></div>




<div class="title">

TWIN QUEST

<br>

LOST MEMORIES

</div>



<div class="subtitle">

A RETRO ADVENTURE

</div>



<button id="startButton">

START GAME

</button>



<audio id="music" loop>

<source src="music.mp3" type="audio/mpeg">

</audio>
<style>


#world{

display:none;

position:absolute;

inset:0;

background:

linear-gradient(

#4b8cff 0%,

#8ed6ff 45%,

#55b95a 45%,

#328035 100%

);

overflow:hidden;

}





.gameCloud{

position:absolute;

width:90px;

height:25px;

background:white;

top:80px;

animation:cloudMove 12s linear infinite;

}




.ground{

position:absolute;

bottom:0;

height:70px;

width:100%;

background:#8b5a2b;

border-top:6px solid #3d7a32;

}





#player{

position:absolute;

bottom:80px;

left:80px;

width:50px;

height:50px;

background:#ffd83d;

border:5px solid black;

}





.enemy{

position:absolute;

bottom:70px;

width:45px;

height:45px;

background:#b52b2b;

border:5px solid black;

}





.obstacle{

position:absolute;

bottom:70px;

width:50px;

height:50px;

background:#555;

border:5px solid black;

}





.beam{

position:absolute;

width:50px;

height:10px;

background:white;

border:3px solid #00ffff;

}





.hud{

position:absolute;

top:10px;

left:10px;

right:10px;

background:black;

padding:10px;

display:flex;

justify-content:space-between;

font-size:14px;

}





.controls{

position:absolute;

bottom:10px;

left:0;

right:0;

display:flex;

justify-content:space-around;

}



.controls button{

margin:0;

padding:12px;

font-size:12px;

background:#222;

border:3px solid white;

box-shadow:3px 3px black;

}



</style>






<div id="world">



<div class="hud">

<span id="score">

SCORE 0000

</span>


<span>

LIVES 03

</span>

</div>





<div class="gameCloud"></div>



<div id="player"></div>



<div class="obstacle" style="left:300px"></div>

<div class="obstacle" style="left:600px"></div>




<div class="enemy" style="left:450px"></div>

<div class="enemy" style="left:750px"></div>





<div class="ground"></div>




<div class="controls">


<button id="left">

LEFT

</button>


<button id="forward">

FORWARD

</button>


<button id="jump">

JUMP

</button>


<button id="attack">

ATTACK

</button>


</div>



</div>





<script>


let player=document.getElementById("player");

let x=80;

let y=80;

let jumping=false;


document.getElementById("startButton").onclick=function(){


document.getElementById("music").play();


document.getElementById("game").style.display="none";


document.getElementById("world").style.display="block";


};




document.getElementById("forward").onclick=function(){

x+=25;

player.style.left=x+"px";

};





document.getElementById("left").onclick=function(){

x-=25;

player.style.left=x+"px";

};






document.getElementById("jump").onclick=function(){


if(jumping)return;


jumping=true;


let up=0;


let timer=setInterval(()=>{


up+=10;


player.style.bottom=(80+up)+"px";



if(up>=100){


clearInterval(timer);



let down=setInterval(()=>{


up-=10;


player.style.bottom=(80+up)+"px";



if(up<=0){

clearInterval(down);

jumping=false;

}


},50);



}



},50);



};







document.getElementById("attack").onclick=function(){


let beam=document.createElement("div");


beam.className="beam";


beam.style.left=(x+50)+"px";

beam.style.bottom="120px";


document.getElementById("world").appendChild(beam);



let move=setInterval(()=>{


let pos=parseInt(beam.style.left);


beam.style.left=(pos+15)+"px";



if(pos>800){

beam.remove();

clearInterval(move);

}



},30);



};
<style>


.memory{

position:absolute;

bottom:120px;

width:25px;

height:25px;

background:#ffd83d;

border:3px solid white;

}




#ending{

display:none;

position:absolute;

inset:0;

background:#11113b;

text-align:center;

padding-top:35vh;

font-size:22px;

line-height:2;

}



</style>





<div class="memory" style="left:220px"></div>

<div class="memory" style="left:520px"></div>




<div id="ending">


QUEST COMPLETE


<br><br>


ALL MEMORIES RESTORED


<br><br>


HAPPY BIRTHDAY TWIN


<br>


I LOVE YOU


</div>






<script>


let score=0;

let collected=0;



let enemies=document.querySelectorAll(".enemy");



function updateScore(){


document.getElementById("score").innerHTML=

"SCORE "+score.toString().padStart(4,"0");


}





function collision(){


let p=player.getBoundingClientRect();



document.querySelectorAll(".obstacle,.enemy").forEach(function(item){


let e=item.getBoundingClientRect();



if(

p.left < e.right &&

p.right > e.left &&

p.top < e.bottom &&

p.bottom > e.top

){


x-=40;

player.style.left=x+"px";


}



});





document.querySelectorAll(".memory").forEach(function(item){


let a=player.getBoundingClientRect();

let b=item.getBoundingClientRect();



if(

a.left < b.right &&

a.right > b.left &&

a.top < b.bottom &&

a.bottom > b.top

){


item.remove();


collected++;

score+=100;


updateScore();



if(collected>=2){


document.getElementById("ending").style.display="block";


}



}



});



}



setInterval(collision,100);







// move enemies


setInterval(()=>{


enemies.forEach(function(enemy){


let pos=parseInt(enemy.style.left);



if(isNaN(pos)){

pos=enemy.offsetLeft;

}



pos-=5;



if(pos<-50){

pos=850;

}



enemy.style.left=pos+"px";



});



},100);





</script>



</div>


</body>

</html>
