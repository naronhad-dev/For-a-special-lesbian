<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twin Quest</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

*{
box-sizing:border-box;
}

body{

margin:0;
height:100vh;

background:#05051a;

display:flex;
justify-content:center;
align-items:center;

font-family:'Press Start 2P',monospace;

color:white;

overflow:hidden;

}


body::after{

content:"";

position:fixed;
inset:0;

background:
repeating-linear-gradient(
0deg,
rgba(255,255,255,.05),
rgba(255,255,255,.05) 2px,
transparent 2px,
transparent 4px
);

pointer-events:none;

}


#console{

width:95%;
max-width:600px;

height:90vh;

background:#101040;

border:8px solid white;

box-shadow:8px 8px #000;

position:relative;

overflow:hidden;

padding:20px;

text-align:center;

}



/* STARS */

.star{

position:absolute;

width:5px;
height:5px;

background:white;

animation:blink 2s infinite;

}


@keyframes blink{

50%{

opacity:.3;

}

}



/* MOON */

.moon{

position:absolute;

right:40px;
top:40px;

width:45px;
height:45px;

background:#fff3a0;

border-radius:50%;

}




.title{

margin-top:60px;

color:#ffd83d;

font-size:22px;

line-height:1.8;

text-shadow:4px 4px #7a4b00;

}



button{

width:85%;

margin:15px auto;

padding:15px;

display:block;

background:#b52b2b;

color:white;

border:5px solid white;

font-family:inherit;

font-size:12px;

box-shadow:5px 5px black;

}


button:active{

transform:translate(4px,4px);

box-shadow:1px 1px black;

}



.screen{

display:none;

}


.active{

display:block;

}


.blink{

animation:blink 1s infinite;

}


</style>

</head>


<body>


<div id="console">


<div class="moon"></div>


<div class="star" style="left:10%;top:20%"></div>

<div class="star" style="left:25%;top:35%"></div>

<div class="star" style="left:45%;top:15%"></div>

<div class="star" style="left:70%;top:25%"></div>

<div class="star" style="left:85%;top:45%"></div>



<div class="title">

TWIN QUEST

<br>

WORLD OF MEMORIES

</div>




<div id="start" class="screen active">


<p class="blink">

PRESS START

</p>


<button onclick="startGame()">
    
START GAME
    
</button>


</div>




<div id="menu" class="screen">


<p>

MAIN MENU

</p>


<button onclick="playGame()">
    
START ADVENTURE
    
</button>


<button onclick="character()">
    
CHARACTER
    
</button>


<button onclick="inventory()">
    
INVENTORY
    
</button>


<button onclick="exitGame()">
    
EXIT
    
</button>


</div>
    



<div id="character" class="screen">


<p>

CHARACTER SELECT

</p>


<div style="
background:#202020;
border:5px solid #ffd83d;
padding:15px;
">


<img 
src="./herphoto.jpg"
style="
width:180px;
height:180px;
object-fit:cover;
border:5px solid white;
">


<p>

NAME:

GANDU

<br><br>

TITLE:

BEST TWIN

<br><br>

LEVEL:

99

</p>


</div>


<button>

SELECT

</button>


</div>







<div id="inventory" class="screen">


<p>

INVENTORY

</p>


<div style="
background:#222;
border:4px solid white;
padding:15px;
">


<p>

MEMORY CARD

<br><br>

LOCKED ITEMS:

<br>

??? 

<br>

???

</p>


</div>


<button>

BACK

</button>


</div>







<div id="game" class="screen">


<div style="
background:black;
padding:10px;
font-size:10px;
display:flex;
justify-content:space-around;
">


<span>
SCORE 000000
</span>


<span>
COINS 000
</span>


<span>
LIVES 03
</span>


</div>





<div style="
height:300px;
margin-top:10px;
border:5px solid black;
background:
linear-gradient(
#4b8cff 0%,
#4b8cff 70%,
#37a537 70%
);
position:relative;
">


<img 
src="./herphoto.jpg"
style="
width:60px;
height:60px;
object-fit:cover;
position:absolute;
bottom:40px;
left:50px;
border:4px solid white;
">


</div>



<p>

WORLD 1-1

</p>


</div>








<div id="exit" class="screen">


<h2>

WARNING

</h2>


<p>

ARE YOU SURE YOU WANT TO EXIT?

</p>


<button onclick="backMenu()">
    
RETURN
    
</button>


</div>





<audio id="music" loop>

<source src="./music.mp3" type="audio/mpeg">

</audio>





<script>


let music = document.getElementById("music");


function showScreen(screen){

    document.querySelectorAll(".screen").forEach(function(item){

        item.classList.remove("active");

    });


    document.getElementById(screen).classList.add("active");

}





function startGame(){

    music.volume = 0.5;

    music.play().catch(function(){

        console.log("Music waiting");

    });


    showScreen("menu");

}





function playGame(){

    showScreen("game");

}





function character(){

    showScreen("character");

}





function inventory(){

    showScreen("inventory");

}





function exitGame(){

    showScreen("exit");

}





function backMenu(){

    showScreen("menu");

}


</script>



</div>


</body>

</html>
