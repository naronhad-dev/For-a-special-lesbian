<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Twin Quest</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

*{
    box-sizing:border-box;
}

body{
    margin:0;
    height:100vh;
    background:#111;
    color:white;
    font-family:'Press Start 2P', monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}


/* CRT SCREEN EFFECT */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.05),
        rgba(255,255,255,0.05) 1px,
        transparent 2px,
        transparent 4px
    );
    pointer-events:none;
}


/* GAME WINDOW */

#game{

    width:95%;
    max-width:500px;
    min-height:650px;

    background:#000;
    border:6px solid #fff;

    box-shadow:
    0 0 20px #00ffff,
    inset 0 0 30px #222;

    padding:25px;

    text-align:center;

    position:relative;

}


/* TITLE */

.title{

    color:#00ffff;
    font-size:22px;
    line-height:1.5;

    animation:flicker 2s infinite;

}


@keyframes flicker{

0%,100%{
opacity:1;
}

50%{
opacity:.7;
}

}


/* MENU BUTTONS */

button{

    width:90%;
    margin:12px;

    padding:15px;

    background:#111;

    color:white;

    border:3px solid white;

    font-family:inherit;

    font-size:12px;

    cursor:pointer;

    transition:.2s;

}


button:hover{

    background:white;
    color:black;

    transform:scale(1.05);

}


/* SCREENS */

.screen{

    display:none;

}


.active{

    display:block;

}


/* START SCREEN */

#startScreen{

    display:block;

}


/* CHARACTER CARD */


.card{

    border:4px solid #00ffff;

    padding:15px;

    margin-top:20px;

}


#characterPhoto{

    width:220px;

    height:220px;

    object-fit:cover;

    border:4px solid white;

    image-rendering:auto;

}


.stats{

    margin-top:15px;

    line-height:2;

    font-size:12px;

}


/* WARNING */

.warning{

    color:#ff3333;

    animation:flicker 1s infinite;

}


/* MESSAGE */

.final{

    color:#ffff00;

    line-height:2;

}


</style>

</head>


<body>


<div id="game">


<div class="title">
🎮 TWIN QUEST 🎮
</div>



<div id="startScreen" class="screen active">

<br><br>

<p>
INSERT COIN
</p>


<button onclick="startGame()">
▶ PRESS START
</button>


</div>




<div id="menuScreen" class="screen">

<p>
MAIN MENU
</p>


<button onclick="selectCharacter()">
🎭 SELECT CHARACTER
</button>


<button onclick="pauseGame()">
⏸ PAUSE
</button>


<button onclick="exitGame()">
🚪 EXIT
</button>


</div>





<div id="characterScreen" class="screen">


<p>
CHARACTER SELECT
</p>


<div class="card">


<img id="characterPhoto" src="./herphoto.jpg">


<div class="stats">

NAME: GANDU<br>

CLASS: BEST TWIN<br>

LEVEL: LEGENDARY<br>

ABILITY: CHAOS +100 ❤️

</div>


</div>


<button onclick="beginQuest()">
⭐ SELECT
</button>


</div>





<div id="pauseScreen" class="screen">

<p>
⏸ GAME PAUSED
</p>


<button onclick="resumeGame()">
▶ RESUME
</button>


</div>





<div id="exitScreen" class="screen">

<p class="warning">
⚠ WARNING ⚠
</p>


<p>
ARE YOU SURE?
<br><br>
LEAVING WILL DELETE
TWIN MEMORIES
</p>


<button onclick="returnGame()">
❤️ STAY
</button>


<button onclick="fakeExit()">
EXIT ANYWAY
</button>


</div>




<div id="finalScreen" class="screen">


<p class="final">

QUEST COMPLETE ⭐

<br><br>

PLAYER GANDU JOINED

<br><br>

🐺 Luv you twin ❤️

</p>


</div>



<audio id="music" loop>

<source src="./music.mp3" type="audio/mpeg">

</audio>



</div>


</body>
<script>


let currentScreen = "startScreen";

let music = document.getElementById("music");

let paused = false;



function showScreen(id){

    document.querySelectorAll(".screen").forEach(screen=>{

        screen.classList.remove("active");

        screen.style.display="none";

    });


    let selected = document.getElementById(id);

    selected.classList.add("active");

    selected.style.display="block";


    currentScreen=id;

}




// START GAME

function startGame(){

    music.volume = 0.5;

    music.play().catch(()=>{

        console.log("Audio waiting for interaction");

    });


    setTimeout(()=>{

        showScreen("menuScreen");

    },500);

}





// CHARACTER SELECT

function selectCharacter(){

    showScreen("characterScreen");

}





// START QUEST

function beginQuest(){

    showScreen("finalScreen");

}





// PAUSE

function pauseGame(){

    paused=true;

    music.pause();

    showScreen("pauseScreen");

}





// RESUME

function resumeGame(){

    paused=false;

    music.play();

    showScreen("menuScreen");

}





// EXIT WARNING

function exitGame(){

    showScreen("exitScreen");

}





// STAY BUTTON

function returnGame(){

    showScreen("menuScreen");

}





// FUNNY EXIT

function fakeExit(){

    document.querySelector("#exitScreen").innerHTML=

    `

    <p class="warning">

    ERROR 404

    </p>


    <p>

    YOU CANNOT LEAVE 😈

    <br><br>

    TWIN QUEST IS TOO POWERFUL

    </p>


    <button onclick="returnGame()">

    RETURN ❤️

    </button>

    `;

}

</script>
</html>
