<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Save The Twinship</title>

<style>

*{
box-sizing:border-box;
image-rendering:pixelated;
}

body{

margin:0;
height:100vh;

background:#020214;

display:flex;
align-items:center;
justify-content:center;

font-family:monospace;

overflow:hidden;

color:white;

}



#game{

width:95%;
max-width:700px;

height:90vh;

background:#08082b;

border:8px solid #ffd34e;

box-shadow:0 0 30px #5b4cff;

position:relative;

overflow:hidden;

}





.sky{

position:absolute;

inset:0;

background:linear-gradient(

#05051c,

#1a1a55

);

}





.star{

position:absolute;

width:4px;

height:4px;

background:white;

}



.moon{

position:absolute;

right:50px;

top:50px;

width:60px;

height:60px;

background:#ffe8a3;

border-radius:50%;

}




.cloud{

position:absolute;

width:90px;

height:18px;

background:#34345f;

animation:cloud 18s linear infinite;

}



@keyframes cloud{

from{

left:-120px;

}

to{

left:700px;

}

}



.menu{

position:absolute;

z-index:5;

top:70px;

width:100%;

text-align:center;

}



.title{

font-size:35px;

color:#ffd34e;

text-shadow:4px 4px #7d2f7d;

}



.sub{

color:#aaa;

margin:15px;

}



.character{

display:inline-block;

background:#11113d;

border:4px solid #666;

padding:20px;

margin:10px;

cursor:pointer;

}



.character.active{

border-color:#ffd34e;

color:#ffd34e;

}



button{

font-family:monospace;

background:#8b3045;

color:white;

border:4px solid white;

padding:14px 25px;

font-size:16px;

cursor:pointer;

box-shadow:5px 5px black;

}



button:active{

transform:translate(3px,3px);

box-shadow:2px 2px black;

}



</style>

</head>


<body>


<div id="game">


<div class="sky"></div>


<div class="moon"></div>


<div class="star" style="left:15%;top:20%"></div>

<div class="star" style="left:40%;top:35%"></div>

<div class="star" style="left:70%;top:15%"></div>

<div class="star" style="left:85%;top:30%"></div>



<div class="cloud" style="top:130px"></div>

<div class="cloud" style="top:240px;animation-delay:7s"></div>





<div id="menu" class="menu">


<div class="title">

SAVE THE<br>TWINSHIP

</div>


<div class="sub">

A RETRO BIRTHDAY ADVENTURE

</div>



<h3>SELECT HERO</h3>



<div class="character active"
onclick="selectCharacter('Gannu')">

GANNU

</div>



<div class="character"
onclick="selectCharacter('Dishan')">

DISHAN

</div>




<br><br>


<button onclick="startGame()">

START QUEST

</button>



</div>





<audio id="music" loop>

<source src="music.mp3" type="audio/mpeg">

</audio>




<script>


let selectedCharacter="Gannu";



function selectCharacter(name){

selectedCharacter=name;

}





function startGame(){


document.getElementById("menu").style.display="none";


document.getElementById("level").style.display="block";


let music=document.getElementById("music");


music.play();


}



</script>
  
<style>


#level{

display:none;

position:absolute;

inset:0;

background:

linear-gradient(

#07072b,

#17175c 55%,

#17551d 55%,

#08200b

);

}




#player{

position:absolute;

left:80px;

bottom:90px;

width:45px;

height:55px;

background:#e6b04a;

border:4px solid black;

}



#ground{

position:absolute;

bottom:0;

width:100%;

height:90px;

background:#32943a;

border-top:8px solid #82db4e;

}



.enemy{

position:absolute;

bottom:90px;

width:45px;

height:45px;

background:#8b2438;

border:4px solid black;

}



#enemy1{

left:350px;

}



#enemy2{

left:600px;

}




.block{

position:absolute;

bottom:90px;

width:50px;

height:50px;

background:#704020;

border:4px solid black;

}



#block1{

left:250px;

}



#block2{

left:500px;

}





.hud{

position:absolute;

top:10px;

left:10px;

right:10px;

background:black;

border:3px solid white;

padding:8px;

z-index:5;

display:flex;

justify-content:space-between;

}



.controls{

position:absolute;

bottom:10px;

width:100%;

display:flex;

justify-content:center;

z-index:5;

}



.controls button{

padding:10px;

font-size:12px;

margin:3px;

background:#222252;

}



.attack{

position:absolute;

width:60px;

height:10px;

background:#8fffff;

border:2px solid white;

}




#boss{

display:none;

position:absolute;

right:80px;

bottom:110px;

width:100px;

height:100px;

background:#651b35;

border:6px solid black;

}



#boss:after{

content:"GANDU";

position:absolute;

top:-30px;

color:white;

}



#chest{

display:none;

position:absolute;

left:300px;

bottom:100px;

width:60px;

height:45px;

background:#c58a2b;

border:5px solid black;

}



#message{

display:none;

position:absolute;

inset:0;

background:#050518;

z-index:20;

text-align:center;

padding-top:35%;

font-size:25px;

color:#ffd34e;

}



</style>





<div id="level">


<div class="hud">

<span>LIVES: 3</span>

<span>STAGE 1</span>

</div>



<div id="player"></div>


<div class="enemy" id="enemy1"></div>

<div class="enemy" id="enemy2"></div>


<div class="block" id="block1"></div>

<div class="block" id="block2"></div>


<div id="ground"></div>




<div class="controls">

<button onclick="leftMove()">BACK</button>

<button onclick="rightMove()">FORWARD</button>

<button onclick="jump()">JUMP</button>

<button onclick="fire()">FIRE</button>

</div>



<div id="boss"></div>


<div id="chest"></div>



</div>





<div id="message">

QUEST COMPLETE

<br><br>

HAPPY BIRTHDAY TWIN

<br>

I LOVE YOU

</div>






<script>


let position=80;

let jumping=false;

let bossHP=100;





function rightMove(){

position+=25;

document.getElementById("player").style.left=

position+"px";

}




function leftMove(){

position-=25;

if(position<0){

position=0;

}

document.getElementById("player").style.left=

position+"px";

}






function jump(){

if(jumping)return;


jumping=true;

let height=0;


let up=setInterval(()=>{


height+=10;


document.getElementById("player").style.bottom=

90+height+"px";



if(height>=100){


clearInterval(up);



let down=setInterval(()=>{


height-=10;


document.getElementById("player").style.bottom=

90+height+"px";


if(height<=0){

clearInterval(down);

jumping=false;

}


},50);



}


},50);


}






function fire(){


let shot=document.createElement("div");


shot.className="attack";


shot.style.left=position+50+"px";


shot.style.bottom="150px";


document.getElementById("level").appendChild(shot);





let move=setInterval(()=>{


let x=parseInt(shot.style.left);


shot.style.left=x+15+"px";



if(x>700){

shot.remove();

clearInterval(move);

}



},30);



}






// reach boss area


setInterval(()=>{


if(position>750){


document.getElementById("boss").style.display="block";


document.querySelector(".hud span:last-child").innerHTML="BOSS: GANDU";


}



},500);





</script>


</div>


</body>

</html>
