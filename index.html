<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Save The Twinship</title>

<style>

*{
box-sizing:border-box;
image-rendering:pixelated;
}


body{

margin:0;

height:100vh;

background:#020214;

display:flex;

justify-content:center;

align-items:center;

font-family:"Courier New",monospace;

overflow:hidden;

color:white;

}





#game{

width:95%;

max-width:700px;

height:90vh;

position:relative;

overflow:hidden;

background:#08082b;

border:8px solid #ffd34e;

box-shadow:

0 0 0 8px #000,

0 0 40px #4d3cff;

}





.sky{

position:absolute;

inset:0;

background:

linear-gradient(

#05051b,

#15155c

);

}





.star{

position:absolute;

width:5px;

height:5px;

background:white;

animation:blink 2s infinite;

}



@keyframes blink{

50%{

opacity:.2;

}

}





.moon{

position:absolute;

right:50px;

top:50px;

width:65px;

height:65px;

background:#ffeaa7;

border-radius:50%;

box-shadow:

-8px 8px #d8c37b;

}





.cloud{

position:absolute;

width:100px;

height:20px;

background:#29295b;

animation:moveCloud 18s linear infinite;

}



.cloud:before{

content:"";

position:absolute;

width:35px;

height:25px;

background:#29295b;

left:20px;

top:-15px;

}



.cloud:after{

content:"";

position:absolute;

width:35px;

height:25px;

background:#29295b;

right:15px;

top:-10px;

}



@keyframes moveCloud{

from{

left:-150px;

}

to{

left:750px;

}

}





.menu{

position:absolute;

z-index:5;

top:80px;

width:100%;

text-align:center;

}





.logo{

font-size:36px;

color:#ffd34e;

text-shadow:

4px 4px #7b2d8b;

line-height:1.3;

}





.small{

color:#aaa;

margin-top:15px;

}





.panel{

margin-top:40px;

}



.character{

display:inline-block;

width:120px;

padding:20px 10px;

margin:10px;

background:#11113d;

border:4px solid #555;

cursor:pointer;

}



.character:hover,

.selected{

border-color:#ffd34e;

color:#ffd34e;

}





button{

font-family:inherit;

background:#8b2d45;

color:white;

border:4px solid white;

padding:14px 30px;

font-size:18px;

cursor:pointer;

box-shadow:

5px 5px #000;

}





button:active{

transform:translate(4px,4px);

box-shadow:1px 1px #000;

}




</style>

</head>


<body>


<div id="game">


<div class="sky"></div>


<div class="moon"></div>



<div class="star" style="left:10%;top:20%"></div>

<div class="star" style="left:25%;top:35%"></div>

<div class="star" style="left:50%;top:15%"></div>

<div class="star" style="left:75%;top:25%"></div>

<div class="star" style="left:85%;top:12%"></div>



<div class="cloud" style="top:130px"></div>

<div class="cloud" style="top:240px;animation-delay:8s"></div>






<div class="menu" id="menu">


<div class="logo">

SAVE THE<br>
TWINSHIP

</div>



<div class="small">

A STARLIGHT BIRTHDAY QUEST

</div>




<div class="panel">


<h3>CHOOSE HERO</h3>


<div class="character selected" onclick="chooseHero('Gannu')">

GANNU

</div>



<div class="character" onclick="chooseHero('Dishan')">

DISHAN

</div>


</div>




<button onclick="startGame()">

START QUEST

</button>



</div>




<audio id="music" loop>

<source src="music.mp3" type="audio/mpeg">

</audio>
<style>


#stage1{

display:none;

position:absolute;

inset:0;

background:

linear-gradient(

#07072d,

#15155a 55%,

#143d1b 55%,

#092009

);

overflow:hidden;

}



#ground{

position:absolute;

bottom:0;

height:90px;

width:100%;

background:

linear-gradient(

#4caf50,

#174d1d

);

border-top:8px solid #8be34b;

}



#player{

position:absolute;

left:80px;

bottom:90px;

width:45px;

height:55px;

background:#e6b04a;

border:4px solid black;

}




#enemy1,
#enemy2{

position:absolute;

bottom:90px;

width:45px;

height:45px;

background:#8f2538;

border:4px solid black;

}




#enemy1{

left:350px;

}



#enemy2{

left:650px;

}





.obstacle{

position:absolute;

bottom:90px;

width:50px;

height:50px;

background:#704020;

border:4px solid black;

}




#block1{

left:250px;

}



#block2{

left:540px;

}





.hud{

position:absolute;

top:10px;

left:10px;

right:10px;

background:black;

border:3px solid white;

padding:8px;

display:flex;

justify-content:space-between;

z-index:5;

}





.controls{

position:absolute;

bottom:10px;

width:100%;

display:flex;

justify-content:center;

z-index:5;

}



.controls button{

font-size:12px;

padding:10px;

margin:5px;

background:#202050;

}





.beam{

position:absolute;

width:55px;

height:10px;

background:#8fffff;

border:2px solid white;

}





</style>







<div id="stage1">


<div class="hud">

<span id="life">

LIVES 3

</span>


<span>

STAGE 1

</span>


</div>




<div id="player"></div>



<div id="enemy1"></div>

<div id="enemy2"></div>




<div class="obstacle" id="block1"></div>

<div class="obstacle" id="block2"></div>




<div id="ground"></div>





<div class="controls">


<button onclick="back()">

BACK

</button>


<button onclick="forward()">

FORWARD

</button>


<button onclick="jump()">

JUMP

</button>


<button onclick="fire()">

FIRE

</button>


</div>




</div>






<script>


let hero="Gannu";


let x=80;


let jumping=false;





function chooseHero(name){

hero=name;

}







function startGame(){


document.getElementById("menu").style.display="none";


document.getElementById("stage1").style.display="block";


document.getElementById("music").play();


}






function forward(){


x+=25;


document.getElementById("player").style.left=x+"px";


}



function back(){


x-=25;


if(x<0){

x=0;

}


document.getElementById("player").style.left=x+"px";


}







function jump(){


if(jumping)return;


jumping=true;


let h=0;



let up=setInterval(()=>{


h+=10;


document.getElementById("player").style.bottom=

90+h+"px";



if(h>=100){


clearInterval(up);



let down=setInterval(()=>{


h-=10;


document.getElementById("player").style.bottom=

90+h+"px";



if(h<=0){


clearInterval(down);

jumping=false;


}



},50);


}



},50);


}






function fire(){



let shot=document.createElement("div");


shot.className="beam";


shot.style.left=x+50+"px";


shot.style.bottom="140px";


document.getElementById("stage1").appendChild(shot);




let move=setInterval(()=>{


let pos=parseInt(shot.style.left);


shot.style.left=pos+15+"px";



if(pos>700){


shot.remove();


clearInterval(move);


}


},30);



}
  
<style>


#stage2{

display:none;

position:absolute;

inset:0;

background:

linear-gradient(

#10051f,

#3a123f

);

}



#boss{

position:absolute;

right:80px;

bottom:120px;

width:100px;

height:100px;

background:#6d2038;

border:6px solid black;

}



#boss:after{

content:"GANDU";

position:absolute;

top:-30px;

left:15px;

color:white;

font-size:15px;

}




#bossBar{

position:absolute;

top:30px;

left:15%;

width:70%;

height:22px;

background:#111;

border:3px solid white;

}



#bossHP{

height:100%;

width:100%;

background:#e33;

}





#chest{

display:none;

position:absolute;

left:280px;

bottom:110px;

width:65px;

height:45px;

background:#c58b2c;

border:5px solid black;

}





#interact{

display:none;

position:absolute;

left:260px;

bottom:180px;

z-index:5;

}



</style>







<div id="stage2">



<div id="bossBar">

<div id="bossHP"></div>

</div>



<div id="boss"></div>



<div id="chest"></div>



<button id="interact">

INTERACT

</button>



</div>






<script>


let bossHealth=100;

let bossDead=false;






function startBoss(){


document.getElementById("stage1").style.display="none";


document.getElementById("stage2").style.display="block";


}






function damageBoss(){


if(bossDead)return;



bossHealth-=20;



document.getElementById("bossHP").style.width=

bossHealth+"%";



if(bossHealth<=0){


bossDead=true;


document.getElementById("boss").style.display="none";


document.getElementById("chest").style.display="block";


document.getElementById("interact").style.display="block";


}



}





document.getElementById("interact").onclick=function(){


document.getElementById("letter").style.display="block";


};





</script>
<style>


#letter{

display:none;

position:absolute;

inset:0;

background:#050518;

z-index:20;

text-align:center;

padding-top:35vh;

color:#ffd84e;

font-size:26px;

line-height:2;

}



#finish{

display:none;

position:absolute;

bottom:200px;

left:260px;

}



</style>





<div id="letter">

QUEST COMPLETE

<br><br>

HAPPY BIRTHDAY TWIN

<br>

I LOVE YOU

</div>






<script>





// after moving far enough, enter boss stage

setInterval(function(){


if(

x>900 &&

document.getElementById("stage1").style.display=="block"

){


startBoss();


}



},500);







// make fire attack work on boss stage


let oldFire=fire;



fire=function(){



if(document.getElementById("stage2").style.display=="block"){


damageBoss();


return;


}



oldFire();


};







// open treasure

document.getElementById("interact").onclick=function(){


document.getElementById("letter").style.display="block";


};






</script>





</div>

</body>

</html>
