<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Save The Twinship</title>

<style>

*{
box-sizing:border-box;
}


body{

margin:0;

height:100vh;

background:#050518;

display:flex;

justify-content:center;

align-items:center;

font-family:monospace;

overflow:hidden;

color:white;

}





#game{

width:95%;

max-width:650px;

height:90vh;

background:#08082a;

border:8px solid #f6d365;

box-shadow:8px 8px #000;

position:relative;

overflow:hidden;

}




/* NIGHT SKY */

.sky{

position:absolute;

inset:0;

background:

linear-gradient(

#05051c,

#10104a

);

}





/* STARS */


.star{

position:absolute;

width:4px;

height:4px;

background:#fff;

animation:twinkle 2s infinite;

}



@keyframes twinkle{

50%{

opacity:.3;

}

}





/* MOON */

.moon{

position:absolute;

right:45px;

top:40px;

width:55px;

height:55px;

background:#ffeaa7;

border-radius:50%;

}




/* PIXEL CLOUDS */


.cloud{

position:absolute;

width:90px;

height:18px;

background:#35356b;

image-rendering:pixelated;

animation:cloudMove 20s linear infinite;

}



.cloud:before{

content:"";

position:absolute;

width:30px;

height:20px;

background:#35356b;

top:-12px;

left:15px;

}



.cloud:after{

content:"";

position:absolute;

width:30px;

height:20px;

background:#35356b;

top:-8px;

right:15px;

}



@keyframes cloudMove{

from{

left:-120px;

}

to{

left:700px;

}

}





/* MENU */


.menu{

position:relative;

z-index:5;

text-align:center;

padding-top:100px;

}




.title{

font-size:32px;

color:#ffd84d;

text-shadow:

4px 4px #8b4513;

line-height:1.5;

}




.subtitle{

margin-top:15px;

color:#aaa;

}




.characters{

margin-top:35px;

}




.character{

display:inline-block;

padding:15px;

margin:10px;

background:#19194a;

border:4px solid #777;

cursor:pointer;

}





.character.active{

border-color:#ffd84d;

color:#ffd84d;

}





button{

font-family:monospace;

font-size:16px;

padding:15px 30px;

margin-top:25px;

background:#b52b2b;

color:white;

border:4px solid white;

box-shadow:5px 5px #000;

cursor:pointer;

}





button:active{

transform:translate(4px,4px);

box-shadow:1px 1px #000;

}




</style>

</head>


<body>


<div id="game">


<div class="sky"></div>


<div class="star" style="left:10%;top:20%"></div>

<div class="star" style="left:25%;top:35%"></div>

<div class="star" style="left:50%;top:15%"></div>

<div class="star" style="left:75%;top:30%"></div>

<div class="star" style="left:85%;top:18%"></div>



<div class="moon"></div>



<div class="cloud" style="top:130px"></div>

<div class="cloud" style="top:220px;animation-delay:8s"></div>






<div class="menu">


<div class="title">

SAVE THE TWINSHIP

</div>


<div class="subtitle">

8-BIT BIRTHDAY QUEST

</div>




<div class="characters">


<h3>SELECT CHARACTER</h3>


<div class="character active" onclick="choose('Gannu')">

GANNU

</div>



<div class="character" onclick="choose('Dishan')">

DISHAN

</div>


</div>





<button onclick="startGame()">

START QUEST

</button>



</div>





<audio id="music" loop>

<source src="music.mp3" type="audio/mpeg">

</audio>
<style>


#world{

display:none;

position:absolute;

inset:0;

background:

linear-gradient(

#07072b 0%,

#15155a 55%,

#102b16 55%,

#071707 100%

);

overflow:hidden;

}





.gameStar{

position:absolute;

width:3px;

height:3px;

background:white;

}





.pixelGround{

position:absolute;

bottom:0;

width:100%;

height:90px;

background:

linear-gradient(

#2f8b32,

#17551d

);

border-top:8px solid #54b946;

}



.pixelGround:before{

content:"";

position:absolute;

top:25px;

left:0;

width:100%;

height:8px;

background:#236c29;

}



#player{

position:absolute;

bottom:90px;

left:80px;

width:40px;

height:50px;

background:#d9a441;

border:4px solid black;

}



#player:before{

content:"";

position:absolute;

top:-15px;

left:8px;

width:18px;

height:15px;

background:#ffd27a;

}



.enemy{

position:absolute;

bottom:90px;

width:45px;

height:45px;

background:#7d1f2b;

border:4px solid black;

}



.enemy:before{

content:"";

position:absolute;

width:8px;

height:8px;

background:white;

left:8px;

top:10px;

box-shadow:20px 0 white;

}





.block{

position:absolute;

bottom:90px;

width:45px;

height:45px;

background:#6b4020;

border:4px solid black;

}





.beam{

position:absolute;

width:45px;

height:8px;

background:#9fffff;

border:2px solid white;

}




.hud{

position:absolute;

top:10px;

left:10px;

right:10px;

padding:8px;

background:#000;

border:3px solid white;

display:flex;

justify-content:space-between;

z-index:5;

font-size:13px;

}




.controls{

position:absolute;

bottom:10px;

left:0;

right:0;

z-index:5;

display:flex;

justify-content:center;

}



.controls button{

margin:4px;

padding:10px;

font-size:12px;

background:#19194a;

}



</style>





<div id="world">


<div class="hud">

<span id="life">

LIVES 3

</span>


<span>

STAGE 1

</span>


</div>





<div class="gameStar" style="left:20%;top:20%"></div>

<div class="gameStar" style="left:60%;top:15%"></div>

<div class="gameStar" style="left:80%;top:30%"></div>




<div id="player"></div>




<div class="enemy" style="left:350px"></div>

<div class="enemy" style="left:650px"></div>



<div class="block" style="left:260px"></div>

<div class="block" style="left:540px"></div>





<div class="pixelGround"></div>




<div class="controls">


<button onclick="moveBack()">

BACK

</button>



<button onclick="moveForward()">

FORWARD

</button>



<button onclick="jumpPlayer()">

JUMP

</button>



<button onclick="shootBeam()">

FIRE

</button>



</div>



</div>









<script>


let selected="Gannu";


let px=80;


let jumping=false;



function choose(name){

selected=name;

}





function startGame(){


document.getElementById("music").play();


document.querySelector(".menu").style.display="none";


document.getElementById("world").style.display="block";


}





function moveForward(){


px+=20;


document.getElementById("player").style.left=

px+"px";


}




function moveBack(){


px-=20;


document.getElementById("player").style.left=

px+"px";


}






function jumpPlayer(){


if(jumping)return;


jumping=true;


let h=0;



let up=setInterval(()=>{


h+=10;


document.getElementById("player").style.bottom=

(90+h)+"px";



if(h>=100){


clearInterval(up);



let down=setInterval(()=>{


h-=10;


document.getElementById("player").style.bottom=

(90+h)+"px";



if(h<=0){


clearInterval(down);

jumping=false;


}



},50);



}



},50);



}







function shootBeam(){



let b=document.createElement("div");


b.className="beam";


b.style.left=(px+40)+"px";

b.style.bottom="130px";


document.getElementById("world").appendChild(b);




let move=setInterval(()=>{


let x=parseInt(b.style.left);


b.style.left=(x+12)+"px";



if(x>700){


b.remove();

clearInterval(move);


}



},30);



}
<style>


#bossStage{

display:none;

position:absolute;

inset:0;

background:

linear-gradient(

#080820,

#2b092b

);

}



#boss{

position:absolute;

bottom:100px;

right:80px;

width:100px;

height:100px;

background:#5b1620;

border:6px solid black;

}




#boss:before{

content:"GANDU";

position:absolute;

top:-30px;

color:white;

font-size:14px;

}



#chest{

display:none;

position:absolute;

bottom:100px;

left:300px;

width:60px;

height:45px;

background:#c58a2b;

border:5px solid black;

}




#interact{

display:none;

position:absolute;

bottom:170px;

left:260px;

background:#222;

}




#letter{

display:none;

position:absolute;

inset:0;

background:#050518;

color:#ffd84d;

text-align:center;

padding-top:35vh;

font-size:22px;

line-height:2;

z-index:20;

}



.bossBar{

position:absolute;

top:40px;

left:20%;

width:60%;

height:20px;

border:3px solid white;

background:#333;

}



#bossHealth{

height:100%;

width:100%;

background:#c52b2b;

}




</style>





<div id="bossStage">


<div class="bossBar">

<div id="bossHealth"></div>

</div>



<div id="boss"></div>


<div id="chest"></div>



<button id="interact">

INTERACT

</button>



</div>




<div id="letter">

QUEST COMPLETE

<br><br>

THE TWINSHIP WAS SAVED

<br><br>

HAPPY BIRTHDAY TWIN

<br>

I LOVE YOU

</div>





<script>


let bossHP=100;


let bossDefeated=false;



function enterBoss(){


document.getElementById("world").style.display="none";


document.getElementById("bossStage").style.display="block";


}




function damageBoss(){


if(bossDefeated)return;



bossHP-=20;



document.getElementById("bossHealth").style.width=

bossHP+"%";



if(bossHP<=0){


bossDefeated=true;


document.getElementById("boss").style.display="none";


document.getElementById("chest").style.display="block";


document.getElementById("interact").style.display="block";


}



}





document.getElementById("interact").onclick=function(){


document.getElementById("letter").style.display="block";


};






// fire beam can damage boss


document.addEventListener("click",function(e){


if(

e.target.innerHTML=="FIRE"

&&

document.getElementById("bossStage").style.display=="block"

){


damageBoss();


}



});





</script>





</div>


</body>

</html>
